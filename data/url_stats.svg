<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#16a34a"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1e293b">시설 URL 수집 결과</text>
  <text x="400" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#64748b">1498개 시설 중 1487개 성공 (99%)</text>
  
  <!-- Donut Chart -->
  <g transform="translate(200, 230)">
    <!-- Background circle -->
    <circle cx="0" cy="0" r="100" fill="none" stroke="#e2e8f0" stroke-width="30"/>
    <!-- Success arc (99%) -->
    <circle cx="0" cy="0" r="100" fill="none" stroke="url(#greenGrad)" stroke-width="30" 
            stroke-dasharray="622 628" stroke-dashoffset="0" 
            transform="rotate(-90)"/>
    <!-- Center text -->
    <text x="0" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#22c55e">99%</text>
    <text x="0" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#64748b">성공률</text>
  </g>
  
  <!-- Stats boxes -->
  <g transform="translate(50, 360)">
    <rect x="0" y="0" width="100" height="70" rx="8" fill="#dcfce7"/>
    <text x="50" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#16a34a">1487</text>
    <text x="50" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#166534">양호</text>
    
    <rect x="110" y="0" width="100" height="70" rx="8" fill="#fef3c7"/>
    <text x="160" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#d97706">11</text>
    <text x="160" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#92400e">의심</text>
    
    <rect x="220" y="0" width="100" height="70" rx="8" fill="#dbeafe"/>
    <text x="270" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2563eb">214</text>
    <text x="270" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1d4ed8">개선됨</text>
  </g>
  
  <!-- Bar Chart -->
  <g transform="translate(420, 100)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e293b">TOP 도메인</text>
    
    <!-- Bar 1 -->
    <rect x="0" y="20" width="280" height="30" rx="4" fill="#e2e8f0"/>
    <rect x="0" y="20" width="280" height="30" rx="4" fill="#3b82f6"/>
    <text x="10" y="40" font-family="Arial, sans-serif" font-size="11" fill="white">metropolitan-funeral.co.kr</text>
    <text x="330" y="40" font-family="Arial, sans-serif" font-size="12" fill="#64748b">153</text>
    
    <!-- Bar 2 -->
    <rect x="0" y="60" width="280" height="30" rx="4" fill="#e2e8f0"/>
    <rect x="0" y="60" width="90" height="30" rx="4" fill="#60a5fa"/>
    <text x="10" y="80" font-family="Arial, sans-serif" font-size="11" fill="white">endingsketch.com</text>
    <text x="330" y="80" font-family="Arial, sans-serif" font-size="12" fill="#64748b">49</text>
    
    <!-- Bar 3 -->
    <rect x="0" y="100" width="280" height="30" rx="4" fill="#e2e8f0"/>
    <rect x="0" y="100" width="60" height="30" rx="4" fill="#93c5fd"/>
    <text x="10" y="120" font-family="Arial, sans-serif" font-size="11" fill="#1e40af">honam-funeral.co.kr</text>
    <text x="330" y="120" font-family="Arial, sans-serif" font-size="12" fill="#64748b">33</text>
    
    <!-- Bar 4 -->
    <rect x="0" y="140" width="280" height="30" rx="4" fill="#e2e8f0"/>
    <rect x="0" y="140" width="51" height="30" rx="4" fill="#bfdbfe"/>
    <text x="10" y="160" font-family="Arial, sans-serif" font-size="11" fill="#1e40af">sisul.or.kr</text>
    <text x="330" y="160" font-family="Arial, sans-serif" font-size="12" fill="#64748b">28</text>
    
    <!-- Bar 5 -->
    <rect x="0" y="180" width="280" height="30" rx="4" fill="#e2e8f0"/>
    <rect x="0" y="180" width="37" height="30" rx="4" fill="#dbeafe"/>
    <text x="10" y="200" font-family="Arial, sans-serif" font-size="11" fill="#1e40af">ncms.go.kr</text>
    <text x="330" y="200" font-family="Arial, sans-serif" font-size="12" fill="#64748b">20</text>
  </g>
  
  <!-- Summary -->
  <g transform="translate(420, 360)">
    <rect x="0" y="0" width="330" height="70" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="165" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#166534">✅ 재검색 성공률</text>
    <text x="165" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#16a34a">214 / 223 (96%)</text>
  </g>
</svg>
